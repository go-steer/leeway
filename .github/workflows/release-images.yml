name: Release images

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to publish (e.g. v0.1.0). Empty = use the current ref.'
        required: false

permissions:
  contents: read
  packages: write
  id-token: write

env:
  REGISTRY: ghcr.io
  IMAGE_OWNER: ${{ github.repository_owner }}
  IMAGE_NAME: leeway

jobs:
  build-and-push:
    name: leeway
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Verify deploy manifest pin matches the tag
        if: github.ref_type == 'tag'
        run: |
          PINNED=$(grep -oE 'image: ghcr.io/go-steer/leeway:v[0-9]+\.[0-9]+\.[0-9]+' deploy/51-deployment-watcher.yaml | head -1 | sed 's/.*leeway://')
          if [[ "$PINNED" != "${{ github.ref_name }}" ]]; then
            echo "::error::deploy/51-deployment-watcher.yaml pins ${PINNED} but the release tag is ${{ github.ref_name }}" >&2
            exit 1
          fi
          echo "deploy/51 pin matches ${{ github.ref_name }}"

      - name: Extract Go version from go.mod
        id: go-version
        run: |
          GO_VERSION=$(grep -E '^go [0-9]+\.[0-9]+(\.[0-9]+)?$' go.mod | awk '{print $2}')
          if [[ -z "$GO_VERSION" ]]; then
            echo "::error::Could not extract Go version from go.mod" >&2
            exit 1
          fi
          echo "version=${GO_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags + labels + annotations
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: index,manifest
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/${{ env.IMAGE_NAME }}
          flavor: |
            latest=false
          tags: |
            type=semver,pattern={{raw}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' && !contains(github.ref_name, '-') }}
            type=raw,value=${{ inputs.tag }},enable=${{ github.event_name == 'workflow_dispatch' && inputs.tag != '' }}
          labels: |
            org.opencontainers.image.title=leeway
            org.opencontainers.image.description=Kubernetes topology placement-drift and ComputeClass priority-rank analyzer (leeway report & leeway watch).
            org.opencontainers.image.vendor=go-steer
          annotations: |
            org.opencontainers.image.title=leeway
            org.opencontainers.image.description=Kubernetes topology placement-drift and ComputeClass priority-rank analyzer (leeway report & leeway watch).
            org.opencontainers.image.vendor=go-steer

      - name: Compute build version
        id: version
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            VERSION="${{ github.ref_name }}"
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" && -n "${{ inputs.tag }}" ]]; then
            VERSION="${{ inputs.tag }}"
          else
            VERSION="main-$(git rev-parse --short HEAD)"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Resolve build date
        id: build-date
        run: echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: mode=max
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          build-args: |
            GO_VERSION=${{ steps.go-version.outputs.version }}
            VERSION=${{ steps.version.outputs.version }}
            COMMIT=${{ github.sha }}
            BUILD_DATE=${{ steps.build-date.outputs.date }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Install cosign
        uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3

      - name: Sign images
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          echo "$TAGS" | xargs -I {} cosign sign --yes "{}@${DIGEST}"

      - name: Install syft
        uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0

      - name: Generate + attest SBOMs
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          IMG="${REGISTRY}/${IMAGE_OWNER}/${IMAGE_NAME}@${DIGEST}"
          for platform in linux/amd64 linux/arm64; do
            arch="${platform#linux/}"
            syft scan "registry:${IMG}" \
              --platform "${platform}" \
              --output "spdx-json=sbom-${arch}.spdx.json"
            cosign attest --yes \
              --type spdxjson \
              --predicate "sbom-${arch}.spdx.json" \
              "${IMG}"
          done

      - name: Verify published signatures + smoke test
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          while IFS= read -r tag; do
            [[ -z "$tag" ]] && continue
            cosign verify "${tag}" \
              --certificate-identity-regexp '^https://github.com/go-steer/leeway' \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com \
              > /dev/null
          done <<< "$TAGS"

          SMOKE_IMG="${REGISTRY}/${IMAGE_OWNER}/${IMAGE_NAME}@${DIGEST}"
          docker run --rm --entrypoint /leeway "${SMOKE_IMG}" version

          ENTRYPOINT=$(docker inspect --format '{{json .Config.Entrypoint}}' "${SMOKE_IMG}")
          if [[ "${ENTRYPOINT}" != '["/leeway","watch"]' ]]; then
            echo "::error::unexpected entrypoint ${ENTRYPOINT} (want [\"/leeway\",\"watch\"])" >&2
            exit 1
          fi

  build-binaries:
    if: github.ref_type == 'tag' || (github.event_name == 'workflow_dispatch' && inputs.tag != '')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Compute build version
        id: version
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            VERSION="${{ github.ref_name }}"
          else
            VERSION="${{ inputs.tag }}"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Resolve build date
        id: build-date
        run: echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Cross-compile all platforms
        env:
          VERSION: ${{ steps.version.outputs.version }}
          COMMIT: ${{ github.sha }}
          BUILD_DATE: ${{ steps.build-date.outputs.date }}
        run: |
          set -euo pipefail
          mkdir -p dist
          LDFLAGS="-s -w \
            -X github.com/go-steer/leeway/internal/version.Version=${VERSION} \
            -X github.com/go-steer/leeway/internal/version.Commit=${COMMIT} \
            -X github.com/go-steer/leeway/internal/version.Date=${BUILD_DATE}"

          for platform in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64; do
            GOOS="${platform%%/*}"; GOARCH="${platform#*/}"
            bin="leeway"; [[ "$GOOS" == "windows" ]] && bin="leeway.exe"
            CGO_ENABLED=0 GOOS="$GOOS" GOARCH="$GOARCH" \
              go build -trimpath -ldflags "$LDFLAGS" \
              -o "build/leeway_${GOOS}_${GOARCH}/${bin}" ./cmd/leeway
            cp LICENSE "build/leeway_${GOOS}_${GOARCH}/"
            archive="leeway_${VERSION}_${GOOS}_${GOARCH}"
            if [[ "$GOOS" == "windows" ]]; then
              (cd "build/leeway_${GOOS}_${GOARCH}" && zip -q "../../dist/${archive}.zip" "$bin" LICENSE)
            else
              tar -czf "dist/${archive}.tar.gz" -C "build/leeway_${GOOS}_${GOARCH}" "$bin" LICENSE
            fi
          done

      - name: Smoke test linux/amd64 binary
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          tar -xzf "dist/leeway_${VERSION}_linux_amd64.tar.gz" -C /tmp
          OUT=$(/tmp/leeway version)
          grep -q "${VERSION}" <<< "$OUT" || { echo "::error::leeway reports wrong version: ${OUT}" >&2; exit 1; }
          rm /tmp/leeway

      - name: Checksums + keyless signature
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          cd dist
          sha256sum -- * > "leeway_${VERSION}_SHA256SUMS"

      - name: Install cosign
        uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3

      - name: Sign checksums (cosign sign-blob, keyless)
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          cosign sign-blob --yes \
            --bundle "dist/leeway_${VERSION}_SHA256SUMS.sigstore.json" \
            "dist/leeway_${VERSION}_SHA256SUMS"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-binaries
          path: dist/*
          retention-days: 7
          if-no-files-found: error

  github-release:
    if: github.ref_type == 'tag'
    needs: [build-and-push, build-binaries]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: release-binaries
          path: dist
      - name: Compose notes and create the Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ./dev/release/compose-release-notes.sh "${{ github.ref_name }}" /tmp/notes.md
          gh release create "${{ github.ref_name }}" \
            --title "${{ github.ref_name }}" \
            --notes-file /tmp/notes.md \
            --verify-tag \
            dist/*
