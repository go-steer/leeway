name: E2E (kind)

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e-kind:
    name: kind cluster + leeway e2e scenarios
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      LEEWAY_E2E_TIMEOUT_SCALE: '2'
      LEEWAY_IMAGE: leeway:examples-dev
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install kind
        run: |
          curl -fsSLo /tmp/kind https://kind.sigs.k8s.io/dl/v0.27.0/kind-linux-amd64
          chmod +x /tmp/kind
          sudo mv /tmp/kind /usr/local/bin/kind
          kind version

      - name: Cluster up + side-load leeway image from HEAD
        run: examples/kind/up --build

      - name: Deploy leeway watcher + stub webhook
        env:
          LEEWAY_IMAGE: leeway:examples-dev
        run: examples/watcher/up

      - name: Run e2e scenarios (placement-drift, zone-unavailable, compute-class-fallback)
        run: examples/e2e

      - name: Dump cluster forensics on failure
        if: failure()
        run: |
          echo "=== stub-webhook wire capture ==="
          kubectl -n agent-triage logs deploy/stub-webhook --tail=-1 || true
          echo "=== leeway watcher logs ==="
          kubectl -n agent-triage logs deploy/leeway --tail=200 || true
          echo "=== all pods ==="
          kubectl get pods -A -o wide || true
          echo "=== nodes ==="
          kubectl get nodes -o wide || true
