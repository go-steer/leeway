name: Scale (kwok)

on:
  schedule:
    - cron: '0 7 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  leeway-scale:
    name: leeway scale & memory regression guard (kwok)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      LEEWAY_SCALE_SETTLE: '30'
      LEEWAY_SCALE_WINDOW: '45'
      LEEWAY_SCALE_MAX_P99_MS: '25'
      LEEWAY_SCALE_MAX_KIB_PER_POD: '110'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install kind
        run: |
          curl -fsSLo /tmp/kind https://kind.sigs.k8s.io/dl/v0.27.0/kind-linux-amd64
          chmod +x /tmp/kind
          sudo mv /tmp/kind /usr/local/bin/kind

      - name: Cluster up + kwok controller
        run: |
          examples/kind/up
          examples/kwok/up

      - name: Rung 1 — 50 fake nodes, ~450 padded pods (quiet)
        run: |
          examples/kwok/scale-up 50 150 3
          examples/kwok/leeway-scale

      - name: Rung 2 — 150 fake nodes, ~1,350 padded pods (quiet)
        run: |
          examples/kwok/scale-up 150 450 3
          examples/kwok/leeway-scale

      - name: Rung 3 — 150 fake nodes, ~1,350 padded pods (churn)
        env:
          LEEWAY_SCALE_CHURN: '4'
        run: examples/kwok/leeway-scale

      - name: Upload scale ladder
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: leeway-scale-ladder
          path: /tmp/leeway-examples/leeway-scale.tsv
          if-no-files-found: ignore
