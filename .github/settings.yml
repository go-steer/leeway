repository:
  name: leeway
  description: >-
    Kubernetes topology placement-drift and ComputeClass priority-rank
    analyzer: one-shot multi-cluster CLI reports (leeway report) and a
    continuous incident watcher with HTTP webhook callbacks (leeway watch)
  homepage: https://go-steer.github.io/leeway/
  topics: >-
    kubernetes, gke, golang, sre, observability, topology-spread,
    compute-class, scheduling, placement-drift

  default_branch: main
  has_issues: true
  has_projects: false
  has_wiki: false
  has_downloads: true

  allow_squash_merge: true
  allow_merge_commit: false
  allow_rebase_merge: false
  delete_branch_on_merge: true

  squash_merge_commit_title: PR_TITLE
  squash_merge_commit_message: PR_BODY

branches:
  - name: main
    protection:
      required_pull_request_reviews:
        required_approving_review_count: 1
        dismiss_stale_reviews: true
        require_code_owner_reviews: true
      required_status_checks:
        strict: true
        contexts:
          - test
          - lint
          - docs-lint
          - go mod tidy is clean
          - govulncheck
      enforce_admins: false
      required_linear_history: true
      restrictions: null

labels:
  - name: bug
    color: d73a4a
    description: Something leeway did that it should not have
  - name: detection-gap
    color: b60205
    description: A real placement skew or rank state leeway failed to report
  - name: enhancement
    color: a2eeef
    description: A new capability or improvement
  - name: documentation
    color: 0075ca
  - name: good first issue
    color: 7057ff
  - name: help wanted
    color: '008672'
  - name: question
    color: d876e3
  - name: infra
    color: c5def5
    description: CI, release, tooling
