# Read-only ClusterRole for `leeway watch` and `leeway report`.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: leeway
  labels:
    app.kubernetes.io/name: leeway
    app.kubernetes.io/component: watcher
rules:
  - apiGroups: [""]
    resources: ["nodes", "pods", "persistentvolumes", "persistentvolumeclaims", "events"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets", "statefulsets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["leeway.lookout.go-steer.io"]
    resources: ["leewaypolicies", "clusterleewaypolicies"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["cloud.google.com"]
    resources: ["computeclasses"]
    verbs: ["get", "list", "watch"]
