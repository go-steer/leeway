apiVersion: apps/v1
kind: Deployment
metadata:
  name: leeway
  namespace: agent-triage
  labels:
    app.kubernetes.io/name: leeway
    app.kubernetes.io/component: watcher
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: leeway
      app.kubernetes.io/component: watcher
  template:
    metadata:
      labels:
        app.kubernetes.io/name: leeway
        app.kubernetes.io/component: watcher
    spec:
      serviceAccountName: leeway
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: leeway
          image: ghcr.io/go-steer/leeway:v0.1.2
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          args:
            - "--in-cluster"
            - "--cluster-name=local"
            - "--metrics-addr=:9090"
            - "--store=/var/lib/leeway/leeway.db"
          volumeMounts:
            - name: leeway-data
              mountPath: /var/lib/leeway
          env:
            - name: GOMEMLIMIT
              value: "600MiB"
          ports:
            - name: metrics
              containerPort: 9090
              protocol: TCP
          resources:
            requests:
              cpu: "50m"
              memory: "128Mi"
            limits:
              cpu: "200m"
              memory: "768Mi"
          livenessProbe:
            httpGet:
              path: /healthz
              port: metrics
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /readyz
              port: metrics
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: leeway-data
          emptyDir: {}
